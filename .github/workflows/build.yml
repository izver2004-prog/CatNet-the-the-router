name: Build CatNet
on:
  push:
  workflow_dispatch:
env:
  SB_VERSION: "1.12.0"
  PFX_BASE64: ${{ secrets.PFX_BASE64 }}
  PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack project zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          if (-not $zip) { throw "Put the project zip (catnet.zip) in the repository root" }
          Expand-Archive $zip.FullName -DestinationPath _src -Force
          $app = Get-ChildItem _src -Recurse -Filter app.py | Select-Object -First 1
          "SRC=$($app.DirectoryName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Install dependencies
        shell: pwsh
        run: pip install -r "$env:SRC\requirements.txt"
      - name: Install PyInstaller (own bootloader = far fewer antivirus false positives)
        shell: pwsh
        run: |
          pip install wheel setuptools
          pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) { Write-Host "Bootloader build failed, using prebuilt PyInstaller"; pip install pyinstaller }
      - name: Download sing-box and wintun
        shell: pwsh
        run: |
          $v = $env:SB_VERSION
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb -Force
          Copy-Item (Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1).FullName "$env:SRC\sing-box.exe"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wt.zip
          Expand-Archive wt.zip -DestinationPath wt -Force
          Copy-Item wt\wintun\bin\amd64\wintun.dll "$env:SRC\wintun.dll"
      - name: Download Xray (XHTTP / mKCP support, optional)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xr -Force
          Copy-Item xr\xray.exe "$env:SRC\xray.exe"
      - name: Download fonts (optional, falls back to Segoe UI)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:SRC\ui\fonts" | Out-Null
          Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" -OutFile "$env:SRC\ui\fonts\Montserrat.ttf"
          Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" -OutFile "$env:SRC\ui\fonts\Inter.ttf"
      - name: Build (folder version, recommended)
        shell: pwsh
        run: |
          cd $env:SRC
          $a = @("--noconfirm","--noupx","--noconsole","--uac-admin","--name","CatNet","--icon","icon.ico","--version-file","version_info.txt",
                 "--add-data","icon.ico;.","--add-data","ui;ui","--add-binary","sing-box.exe;.","--add-binary","wintun.dll;.",
                 "--collect-all","webview","--collect-all","pythonnet","--collect-all","clr_loader",
                 "--hidden-import","clr","--hidden-import","pystray._win32")
          if (Test-Path xray.exe) { $a += @("--add-binary","xray.exe;.") }
          pyinstaller @a --onedir --distpath dist_folder --workpath build_folder app.py
      - name: Build (single exe)
        shell: pwsh
        run: |
          cd $env:SRC
          $a = @("--noconfirm","--noupx","--noconsole","--uac-admin","--name","CatNet","--icon","icon.ico","--version-file","version_info.txt",
                 "--add-data","icon.ico;.","--add-data","ui;ui","--add-binary","sing-box.exe;.","--add-binary","wintun.dll;.",
                 "--collect-all","webview","--collect-all","pythonnet","--collect-all","clr_loader",
                 "--hidden-import","clr","--hidden-import","pystray._win32")
          if (Test-Path xray.exe) { $a += @("--add-binary","xray.exe;.") }
          pyinstaller @a --onefile --distpath dist_single --workpath build_single app.py
      - name: Sign (only if PFX_BASE64 secret is set)
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -Last 1).FullName
          foreach ($f in @("$env:SRC\dist_folder\CatNet\CatNet.exe", "$env:SRC\dist_single\CatNet.exe")) {
            & $st sign /f "$PWD\cert.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
          }
          Remove-Item cert.pfx
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "$env:SRC\dist_folder\CatNet" -DestinationPath out\CatNet-folder.zip
          Copy-Item "$env:SRC\dist_single\CatNet.exe" out\CatNet.exe
          Get-FileHash out\CatNet-folder.zip, out\CatNet.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content out\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CatNet-folder
          path: |
            out/CatNet-folder.zip
            out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CatNet-single-exe
          path: out/CatNet.exe
